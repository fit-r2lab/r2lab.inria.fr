# redirect http -> https

# from http://nginx.org/en/docs/http/websocket.html
map $http_upgrade $connection_upgrade {
    default Upgrade;
    ''      Close;
}

server {
        server_name r2lab.inria.fr fit-r2lab.inria.fr prod-r2lab.inria.fr;
        listen 80;
        listen [::]:80;
        return 301 https://$host$request_uri;

	access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log info;
}


server {
        server_name r2lab.inria.fr fit-r2lab.inria.fr prod-r2lab.inria.fr;
        listen prod-r2lab.inria.fr:443 ssl;
        # listen [::]:443 ssl;
	http2 on;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log info;

	# using auto-renewed SSL certs
        #ssl_certificate "/etc/pki/tls/certs/r2lab_inria_fr.pem";
        #ssl_certificate_key "/etc/pki/tls/private/fit+r2lab.key";
        ssl_certificate "/etc/dsissl/auto/prod-r2lab.inria.fr/fullchain.pem";
        ssl_certificate_key "/etc/dsissl/auto/prod-r2lab.inria.fr/privkey.pem";

        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;	

	location /assets/ {
            alias /var/www/r2lab.inria.fr/django/assets/;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

	# the documentation book, built from the r2lab-docs repo as static files
	# (see r2lab-docs/deploy/update.sh); it is built with BASE_URL=/docs
	location = /docs {
            return 301 /docs/;
        }
	location /docs/ {
            alias /var/www/r2lab-docs/;
            try_files $uri $uri.html $uri/index.html =404;
            expires 5m;
        }

        location / {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $http_host;
            # we don't want nginx trying to do something clever with
            # redirects, we set the Host: header above already.
            proxy_redirect off;
            proxy_pass http://unix:/run/r2lab-django.sock;
        }

        error_page 404 /404.html;
	    location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }
}
