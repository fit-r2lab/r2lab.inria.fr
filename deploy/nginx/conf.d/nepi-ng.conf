server {
        server_name nepi-ng.inria.fr prod-nepi-ng.inria.fr;
        listen prod-r2lab.inria.fr:443 ssl;
        # listen [::]:443 ssl;
	http2 on;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log info;

	# this cert is valid for nepi-ng too
        ssl_certificate "/etc/dsissl/auto/prod-r2lab.inria.fr/fullchain.pem";
        ssl_certificate_key "/etc/dsissl/auto/prod-r2lab.inria.fr/privkey.pem";

	root /var/www/nepi-ng;

}
