<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- an orange disc with a down arrow and an up arrow (transfer in both directions),
     used on the livemap for a node that is loading or saving an image (state 'telnet');
     256x256 like the logos -->
<svg width="256px" height="256px" viewBox="0 0 256 256" version="1.1" xmlns="http://www.w3.org/2000/svg">
	<circle cx="128" cy="128" r="124" fill="#f5a623"/>
	<g fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
		<!-- down: load -->
		<path d="M92 56 V196 M52 156 L92 196 L132 156"/>
		<!-- up: save -->
		<path d="M164 200 V60 M124 100 L164 60 L204 100"/>
	</g>
</svg>
